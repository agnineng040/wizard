<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizard: Middle-earth Master</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=MedievalSharp&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ring-gold: #ffd700;
            --parchment: #f4e4bc;
            --deep-forest: #0a0a0a;
            --elven-green: #2d5a27;
            --glass-bg: rgba(10, 25, 10, 0.60); 
        }

        body {
            margin: 0; background-color: var(--deep-forest); color: var(--parchment);
            font-family: 'Quicksand', sans-serif; min-height: 100vh; min-height: 100dvh;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #bg-map {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: #14231a url('image_4de622.jpg') no-repeat center center; /* solid colour shows if the image is missing */
            background-size: cover; 
            filter: brightness(0.6) contrast(1.1);
        }

        .main-container {
            display: flex; gap: 20px; width: 95%; max-width: 1000px; 
            align-items: flex-start; z-index: 10;
        }

        .app-box {
            background: var(--glass-bg); 
            border: 2px solid var(--ring-gold);
            padding: 2rem; border-radius: 12px; flex: 2;
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
            text-align: center; backdrop-filter: blur(4px);
            max-height: 90vh; overflow-y: auto;
        }

        .score-sidebar {
            background: var(--glass-bg);
            border: 2px solid var(--ring-gold);
            padding: 1.5rem; border-radius: 12px; flex: 0.8;
            min-width: 220px; position: sticky; top: 20px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 25px rgba(0,0,0,0.7);
        }

        h1, h3 { font-family: 'Cinzel', serif; color: var(--ring-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .subtitle { font-family: 'MedievalSharp', Georgia, serif; color: #ccc; margin-bottom: 20px; }

        .setting { text-align: left; margin-bottom: 15px; }
        label { display: block; font-family: 'MedievalSharp', Georgia, serif; margin-bottom: 5px; color: var(--ring-gold); }
        
        input, select {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--ring-gold);
            background: rgba(0,0,0,0.7); color: white; font-size: 1rem; 
            box-sizing: border-box; 
        }
        
        input:focus, select:focus { outline: 2px solid var(--ring-gold); }

        button {
            width: 100%; background: var(--elven-green); color: white; border: 1px solid var(--ring-gold);
            padding: 15px; font-family: 'Cinzel', Georgia, serif; font-weight: bold; cursor: pointer;
            border-radius: 6px; transition: 0.3s; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
            box-sizing: border-box;
        }
        button:hover { background: #1f3d1b; box-shadow: 0 0 15px rgba(45, 90, 39, 0.8); transform: translateY(-2px); }

        button.secondary { background: transparent; color: var(--ring-gold); border: 1px solid var(--ring-gold); font-size: 0.8rem; margin-top: 5px; }
        button.secondary:hover { background: rgba(255, 215, 0, 0.1); box-shadow: none; transform: none; }

        .player-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.08); padding: 10px; margin-bottom: 8px; border-radius: 6px; border: 1px solid rgba(255,215,0,0.2); }
        .player-row input { width: 70px; text-align: center; }
        
        .side-score-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.2); font-size: 1.1rem; }
        .delta { font-size: 0.85rem; font-weight: bold; margin-left: 5px; }
        .pos { color: #44ff44; } .neg { color: #ff4444; }

        .trick-counter {
            background: rgba(0, 0, 0, 0.5); border: 1px dashed var(--ring-gold);
            padding: 12px; margin-bottom: 15px; border-radius: 8px; font-size: 1.1rem;
        }

        .hidden { display: none !important; }
        .error-msg { background: rgba(255,68,68,0.15); border: 1px solid #ff4444; color: #ffb3b3; padding: 10px; border-radius: 6px; margin-bottom: 10px; text-align: left; }

        @media (max-width: 768px) {
            /* Let the whole page scroll on phones so the scoreboard below the form is reachable */
            body { overflow-y: auto; align-items: flex-start; padding: 10px 0; }
            .app-box { max-height: none; overflow-y: visible; }
            .main-container { flex-direction: column; align-items: center; }
            .score-sidebar { width: 100%; position: relative; top: 0; order: 2; margin-top: 20px; }
        }
    </style>
</head>
<body>

<div id="bg-map"></div>

<div class="main-container">
    <div class="app-box" id="setupScreen">
        <h1>Wizard</h1>
        <p class="subtitle">The Council of Scorers</p>
        
        <div class="setting">
            <label>Players (3-10)</label>
            <select id="pCount" onchange="calculateDeck()">
                <option value="3">3 Players</option>
                <option value="4" selected>4 Players</option>
                <option value="5">5 Players</option>
                <option value="6">6 Players</option>
                <option value="7">7 Players</option>
                <option value="8">8 Players</option>
                <option value="9">9 Players</option>
                <option value="10">10 Players</option>
            </select>
        </div>
        
        <div class="setting">
            <label>Deck Type</label>
            <select id="deckType" onchange="calculateDeck()">
                <option value="60">Official Wizard Deck (60 cards)</option>
                <option value="52">Standard Deck (52 cards)</option>
                <option value="56">Standard Deck + 4 Jokers (56 cards)</option>
            </select>
        </div>
        
        <div class="setting">
            <label>Game Length</label>
            <select id="gameLengthType" onchange="calculateDeck()">
                <option value="full">Full Game (Max rounds)</option>
                <option value="custom">Custom Rounds</option>
            </select>
        </div>
        
        <div class="setting" id="customRoundsDiv" style="display:none;">
            <label>Number of Rounds</label>
            <input type="number" id="customRounds" value="10" min="1" max="60" oninput="calculateDeck()">
        </div>
        
        <div id="resumeBox" class="hidden" style="background: rgba(255,215,0,0.12); border: 1px dashed var(--ring-gold); padding: 12px; margin-bottom: 15px; border-radius: 8px;"><strong>A quest is in progress.</strong><button onclick="resumeSavedGame()">Resume Saved Quest</button><button class="secondary" onclick="discardSavedGame()">Discard Saved Quest</button></div>
        <div id="deckReport" class="inventory-hint" style="background: rgba(45, 90, 39, 0.4); border-left: 4px solid var(--elven-green); padding: 15px; margin: 20px 0;"></div>
        <button onclick="goToNameScreen()">Begin the Quest</button>
    </div>

    <div class="app-box hidden" id="nameScreen">
        <h1>The Fellowship</h1>
        <p class="subtitle">Name your champions</p>
        
        <div id="nameInputsContainer"></div>
        
        <button onclick="confirmNamesAndStart()">Forge the Covenant</button>
        <button class="secondary" onclick="goBackToSetup()">← Back to Setup</button>
    </div>

    <div class="app-box hidden" id="gameScreen">
        <h1 id="roundHeader">Round 1</h1>
        <p class="subtitle" id="phaseSubtitle">Bidding Phase</p>
        
        <div id="trickCounter" class="trick-counter"></div>

        <div id="playerInputs"></div>
        <div id="errorMsg" class="error-msg hidden" role="alert"></div>
        <button id="submitBtn" onclick="submitPhase()">Lock in Bids</button>
        <button id="backBtn" class="secondary hidden" onclick="handleGameScreenBack()"></button>
    </div>

    <div class="app-box hidden" id="scoreScreen">
        <h1 id="scoreTitle">Round Complete</h1>
        <p class="subtitle" id="scoreSubtitle">The Chronicle has been updated.</p>
        <button id="continueBtn" onclick="nextRound()">Continue Journey</button>
        <button class="secondary" onclick="undoScoreAndGoBack()">← Edit Tricks Won (Undo Scores)</button>
    </div>

    <div class="score-sidebar hidden" id="sidebar">
        <h3>The Chronicle</h3>
        <div id="sidebarContent"></div>
    </div>
</div>

<script>
    let players = [];
    let currentRound = 1;
    let maxRounds = 10;
    let currentPhase = 'bidding';
    let history = [];       // one entry per completed round: { bids: [], tricks: [], deltas: [] }
    let gameActive = false; // true while a game is in progress (drives the unload warning)
    let gameOver = false;
    const MAX_CUSTOM_ROUNDS = 60;

    // Escapes text for safe use in HTML content AND double/single-quoted attributes.
    function sanitizeHTML(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Strict integer read: returns NaN for empty, fractional, or non-numeric input.
    function readInt(i) {
        const raw = document.getElementById(`val_${i}`).value.trim();
        if (raw === '') return NaN;
        const n = Number(raw);
        return Number.isInteger(n) ? n : NaN;
    }

    function scoreFor(bid, won) {
        return won === bid ? 20 + won * 10 : Math.abs(won - bid) * -10;
    }

    // Scores are always derived from history, so undo/back can never drift them.
    function recomputeScores() {
        players.forEach((p, i) => {
            p.score = history.reduce((sum, r) => sum + r.deltas[i], 0);
            p.lastDelta = history.length ? history[history.length - 1].deltas[i] : 0;
        });
    }

    // ---- Persistence: survive refreshes, crashes and mobile tab discards ----
    const STORAGE_KEY = 'wizardScorer.v1';

    function saveState() {
        try {
            if (!gameActive) { localStorage.removeItem(STORAGE_KEY); return; }
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                players, history, currentRound, currentPhase, maxRounds,
                screen: document.getElementById('scoreScreen').classList.contains('hidden') ? 'game' : 'score'
            }));
        } catch (e) { /* storage unavailable (private mode / quota): game still works, just unsaved */ }
    }

    function loadSavedState() {
        try {
            const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
            const n = s && Array.isArray(s.players) ? s.players.length : 0;
            if (n < 3 || n > 10 || !Array.isArray(s.history)) return null;
            const okHistory = s.history.every(r => r && [r.bids, r.tricks, r.deltas].every(a => Array.isArray(a) && a.length === n));
            const okPlayers = s.players.every(p => p && typeof p.name === 'string');
            const okRound = Number.isInteger(s.currentRound) && s.currentRound >= 1 && s.currentRound <= s.maxRounds;
            if (!okHistory || !okPlayers || !okRound || s.history.length > s.currentRound) return null;
            return s;
        } catch (e) { return null; }
    }

    function resumeSavedGame() {
        const s = loadSavedState();
        if (!s) { discardSavedGame(); return; }
        players = s.players.map(p => ({
            name: String(p.name), score: 0, lastDelta: 0,
            bid: Number.isInteger(p.bid) ? p.bid : 0,
            lastTricks: Number.isInteger(p.lastTricks) ? p.lastTricks : 0
        }));
        history = s.history;
        currentRound = s.currentRound;
        maxRounds = s.maxRounds;
        currentPhase = s.currentPhase === 'tricks' ? 'tricks' : 'bidding';
        gameActive = true;
        gameOver = false;
        recomputeScores();

        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('sidebar').classList.remove('hidden');
        if (s.screen === 'score' && history.length === currentRound) {
            showScoreScreen();
        } else {
            updateSidebar(false);
            document.getElementById('gameScreen').classList.remove('hidden');
            setupRoundUI();
        }
    }

    function discardSavedGame() {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        document.getElementById('resumeBox').classList.add('hidden');
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function clearError() {
        document.getElementById('errorMsg').classList.add('hidden');
    }

    window.addEventListener('beforeunload', function (e) {
        if (gameActive && !gameOver) {
            e.preventDefault();
            e.returnValue = 'Are you sure you want to abandon the quest? All scores will be lost.';
        }
    });

    function calculateDeck() {
        const p = parseInt(document.getElementById('pCount').value) || 3;
        const deckSize = parseInt(document.getElementById('deckType').value);
        const lengthType = document.getElementById('gameLengthType').value;
        const customDiv = document.getElementById('customRoundsDiv');
        
        if (lengthType === 'full') {
            customDiv.style.display = 'none';
            maxRounds = Math.floor(deckSize / p);
        } else {
            customDiv.style.display = 'block';
            let parsedRounds = parseInt(document.getElementById('customRounds').value);
            maxRounds = (isNaN(parsedRounds) || parsedRounds < 1) ? 1 : Math.min(parsedRounds, MAX_CUSTOM_ROUNDS);
        }

        const maxCards = p * maxRounds;
        const decks = Math.ceil(maxCards / deckSize);
        document.getElementById('deckReport').innerHTML = `<strong>Deckmaster's Math:</strong><br>Max Cards Needed at Once: <strong>${maxCards}</strong><br>Decks Required: <strong>${decks}</strong>`;
    }

    function goToNameScreen() {
        gameActive = false;
        saveState();
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('nameScreen').classList.remove('hidden');
        
        const pCount = parseInt(document.getElementById('pCount').value);
        const container = document.getElementById('nameInputsContainer');
        
        let htmlBuffer = '';
        for (let i = 0; i < pCount; i++) {
            let defaultName = players[i] ? sanitizeHTML(players[i].name) : `Hero ${i + 1}`;
            htmlBuffer += `
                <div class="setting">
                    <label>Player ${i + 1}</label>
                    <input type="text" id="playerName_${i}" value="${defaultName}" maxlength="15" placeholder="Enter name...">
                </div>
            `;
        }
        container.innerHTML = htmlBuffer;
    }

    function goBackToSetup() {
        document.getElementById('nameScreen').classList.add('hidden');
        document.getElementById('setupScreen').classList.remove('hidden');
    }

    function confirmNamesAndStart() {
        const pCount = parseInt(document.getElementById('pCount').value);
        
        players = [];
        for (let i = 0; i < pCount; i++) {
            let inputVal = document.getElementById(`playerName_${i}`).value.trim();
            let finalName = inputVal !== "" ? inputVal : `Hero ${i + 1}`;
            // Keep names unique so the Chronicle is never ambiguous
            const base = finalName;
            let n = 2;
            while (players.some(p => p.name.toLowerCase() === finalName.toLowerCase())) {
                finalName = `${base} (${n++})`;
            }
            players.push({ name: finalName, score: 0, bid: 0, lastDelta: 0, lastTricks: 0 });
        }

        history = [];
        currentRound = 1;
        currentPhase = 'bidding';
        gameActive = true;
        gameOver = false;

        document.getElementById('nameScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('sidebar').classList.remove('hidden');
        
        updateSidebar(false);
        setupRoundUI();
    }

    // showDelta: only show last round's +/- on the round-complete screen
    function updateSidebar(showDelta) {
        const content = document.getElementById('sidebarContent');
        let htmlBuffer = '';
        [...players].sort((a,b) => b.score - a.score).forEach(p => {
            const safeName = sanitizeHTML(p.name);
            const deltaClass = p.lastDelta >= 0 ? 'pos' : 'neg';
            const deltaText = (showDelta && p.lastDelta !== 0) ? `<span class="delta ${deltaClass}">(${p.lastDelta > 0 ? '+' : ''}${p.lastDelta})</span>` : '';
            htmlBuffer += `<div class="side-score-item"><span>${safeName}</span><span>${p.score}${deltaText}</span></div>`;
        });
        content.innerHTML = htmlBuffer;
    }

    function updateTrickCounter() {
        let sum = 0;
        for (let i = 0; i < players.length; i++) {
            const v = readInt(i);
            if (!isNaN(v) && v >= 0) sum += v; // ignore empty/negative/fractional entries
        }
        
        let diff = currentRound - sum;
        let counterDiv = document.getElementById('trickCounter');

        if (currentPhase === 'bidding') {
            counterDiv.innerHTML = `Total Bids: <strong>${sum}</strong> <span style="color:#aaa; font-size: 0.9rem;">(Available: ${currentRound})</span>`;
        } else {
            let statusColor = diff === 0 ? '#44ff44' : (diff < 0 ? '#ff4444' : 'var(--ring-gold)');
            let diffText = diff < 0 ? `Over by: <strong style="color:${statusColor}">${Math.abs(diff)}</strong>` : `Remaining: <strong style="color:${statusColor}">${diff}</strong>`;
            
            counterDiv.innerHTML = `Accounted: <strong>${sum}</strong> / ${currentRound} | ${diffText}`;
        }
    }

    function setupRoundUI() {
        document.getElementById('roundHeader').innerText = `Round ${currentRound} of ${maxRounds}`;
        const container = document.getElementById('playerInputs');
        const backBtn = document.getElementById('backBtn');
        
        if (currentPhase === 'bidding') {
            document.getElementById('phaseSubtitle').innerText = "Bidding Phase: How many tricks will you win?";
            document.getElementById('submitBtn').innerText = "Lock in Bids";
            backBtn.innerText = currentRound === 1 ? "← Edit Players (Back to Names)" : "← Back to Previous Round";
        } else {
            document.getElementById('phaseSubtitle').innerText = "Results Phase: How many tricks did you ACTUALLY win?";
            document.getElementById('submitBtn').innerText = "Calculate Scores";
            backBtn.innerText = "← Edit Bids / Correct Error";
        }
        backBtn.classList.remove('hidden');

        let htmlBuffer = '';
        players.forEach((p, i) => {
            const safeName = sanitizeHTML(p.name);
            let val = (currentPhase === 'bidding') ? p.bid : p.lastTricks;
            
            htmlBuffer += `<div class="player-row">
                <span><strong>${safeName}</strong> ${currentPhase==='tricks'?`<br><small style="color:var(--ring-gold)">Bid: ${p.bid}</small>`:''}</span>
                <input type="number" id="val_${i}" value="${val}" min="0" max="${currentRound}" oninput="updateTrickCounter()">
            </div>`;
        });
        container.innerHTML = htmlBuffer;
        
        updateTrickCounter();
        clearError();
        saveState();
    }

    function handleGameScreenBack() {
        if (currentPhase === 'tricks') {
            // Keep any results typed but not yet locked in
            players.forEach((p, i) => {
                const v = readInt(i);
                if (!isNaN(v) && v >= 0) p.lastTricks = v;
            });
            currentPhase = 'bidding';
            setupRoundUI();
        } else if (currentPhase === 'bidding') {
            if (currentRound === 1) {
                document.getElementById('gameScreen').classList.add('hidden');
                document.getElementById('sidebar').classList.add('hidden');
                goToNameScreen();
            } else {
                // Previous round is still fully recorded in history
                currentRound--;
                showScoreScreen();
            }
        }
    }

    function showScoreScreen() {
        recomputeScores();
        gameOver = currentRound >= maxRounds;

        const title = document.getElementById('scoreTitle');
        const subtitle = document.getElementById('scoreSubtitle');
        const btn = document.getElementById('continueBtn');
        if (gameOver) {
            const top = Math.max(...players.map(p => p.score));
            const winners = players.filter(p => p.score === top).map(p => p.name);
            title.textContent = "Journey's End";
            subtitle.textContent = winners.length > 1
                ? `A tie! ${winners.join(' & ')} share the crown with ${top} points.`
                : `${winners[0]} rules Middle-earth with ${top} points!`;
            btn.textContent = 'Begin a New Quest';
        } else {
            title.textContent = 'Round Complete';
            subtitle.textContent = 'The Chronicle has been updated.';
            btn.textContent = 'Continue Journey';
        }

        updateSidebar(true);
        clearError();
        document.getElementById('gameScreen').classList.add('hidden');
        document.getElementById('scoreScreen').classList.remove('hidden');
        saveState();
    }

    function resetGame() {
        players = [];
        history = [];
        currentRound = 1;
        currentPhase = 'bidding';
        gameActive = false;
        gameOver = false;
        document.getElementById('scoreScreen').classList.add('hidden');
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('setupScreen').classList.remove('hidden');
        saveState();
        calculateDeck();
    }

    function undoScoreAndGoBack() {
        const r = history[currentRound - 1];
        if (!r) return;
        // Restore that round's bids/tricks for editing, then remove its record
        players.forEach((p, i) => {
            p.bid = r.bids[i];
            p.lastTricks = r.tricks[i];
        });
        history.length = currentRound - 1;
        gameOver = false;
        recomputeScores();
        updateSidebar(false);

        document.getElementById('scoreScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        currentPhase = 'tricks';
        setupRoundUI();
    }

    function submitPhase() {
        if (currentPhase === 'bidding') {
            for (let i = 0; i < players.length; i++) {
                let val = readInt(i);
                if (isNaN(val) || val < 0 || val > currentRound) {
                    showError(`Invalid bid for ${players[i].name}. Bid must be a whole number between 0 and ${currentRound}.`);
                    return;
                }
                players[i].bid = val;
            }
            currentPhase = 'tricks';
            setupRoundUI();
        } else {
            let total = 0;
            const entries = [];
            
            for (let i = 0; i < players.length; i++) {
                let won = readInt(i);
                if (isNaN(won) || won < 0 || won > currentRound) {
                    showError(`Invalid tricks won for ${players[i].name}. Must be a whole number between 0 and ${currentRound}.`);
                    return;
                }
                total += won;
                entries.push(won);
            }
            
            if (total !== currentRound) {
                showError(`Math Error! You entered a total of ${total} tricks won, but there are exactly ${currentRound} tricks in this round. Please correct the numbers.`);
                return;
            }

            players.forEach((p, i) => { p.lastTricks = entries[i]; });

            // Record the round (replacing any stale entry); scores are derived from history
            history.length = currentRound - 1;
            history.push({
                bids: players.map(p => p.bid),
                tricks: entries.slice(),
                deltas: players.map((p, i) => scoreFor(p.bid, entries[i]))
            });

            showScoreScreen();
        }
    }

    function nextRound() {
        if (gameOver) {
            resetGame();
            return;
        }

        // Start the new round with blank bids and results
        players.forEach(p => {
            p.bid = 0;
            p.lastTricks = 0;
        });
        
        currentRound++;
        currentPhase = 'bidding';
        document.getElementById('scoreScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        setupRoundUI();
    }

    calculateDeck();
    if (loadSavedState()) document.getElementById('resumeBox').classList.remove('hidden');
</script>
</body>
</html>
